<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kaizen Japanese</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">改</div>
      <div class="brandText">
        <div class="brandTitle">Kaizen Japanese</div>
        <div class="brandSub">Vocabulary Trainer</div>
      </div>
    </div>

    <div class="topActions">
      <button id="toggleTheme" class="pillBtn" title="Toggle theme">🌙</button>
      <button id="togglePremium" class="pillBtn premiumBtn" title="Premium toggle">
        Premium: <span id="premiumLabel">OFF</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="controls">
      <div class="tabs">
        <button class="tab active" data-tab="words">Words</button>
        <button class="tab" data-tab="saved">Saved <span class="count" id="savedCount">0</span></button>
      </div>

      <div class="filters">
        <input id="searchInput" class="search" placeholder="Search: kanji / reading / meaning" />

        <select id="levelFilter" class="select">
          <option value="All">All levels</option>
          <option value="N4">N4</option>
          <option value="N3">N3</option>
          <option value="N2">N2</option>
        </select>

        <select id="posFilter" class="select">
          <option value="All">All POS</option>
        </select>

        <select id="sortBy" class="select">
          <option value="Level">Sort: Level</option>
          <option value="A-Z">Sort: A-Z</option>
          <option value="Saved">Sort: Saved</option>
        </select>
      </div>
    </section>

    <section id="grid" class="grid"></section>

    <section id="emptyState" class="empty hidden">
      <div class="emptyTitle">No results</div>
      <div class="emptySub">Try changing filters or searching differently.</div>
    </section>
  </main>

  <!-- MODAL -->
  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modalOverlay" data-close="1"></div>

    <div class="modalCard" role="dialog" aria-modal="true">
      <div class="modalTop">
        <div class="modalTitleArea">
          <div class="modalTitleRow">
            <div class="modalKanji" id="mKanji">—</div>
            <div class="chips">
              <span class="chip" id="mPosChip">POS</span>
              <span class="chip chipLevel" id="mLevelChip">N?</span>
              <span class="chip chipPremium hidden" id="mPremiumChip">Premium</span>
            </div>
          </div>

          <div class="modalReading" id="mReading">—</div>
          <div class="modalMeaning" id="mMeaning">—</div>
        </div>

        <button class="iconBtn" id="closeModal" title="Close">✕</button>
      </div>

      <div class="modalBody">
        <div class="section">
          <div class="sectionTitle">WORD TYPE</div>
          <div class="cardLine" id="mPosLine">—</div>
        </div>

        <div class="section">
          <div class="sectionTitle">EXAMPLE SENTENCES</div>
          <div id="mExamples" class="exampleList"></div>
        </div>

        <div class="section">
          <div class="sectionTitle">STUDY TIPS</div>
          <ul id="mTips" class="tips"></ul>
        </div>
      </div>

      <div class="modalFooter">
        <button id="modalSave" class="btn primary">☆ Save Word</button>
        <button id="modalCopy" class="btn">Copy</button>
        <button id="modalClose" class="btn ghost">Close</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
