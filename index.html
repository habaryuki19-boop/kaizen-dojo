<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaizen Japanese</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo">改善</div>
        <div class="brandText">
          <div class="title">Kaizen Japanese</div>
          <div class="subtitle">Vocabulary Trainer</div>
        </div>
      </div>

      <div class="controls">
        <button id="toggleTheme" class="btn ghost" type="button" title="Toggle theme">
          🌙/☀️
        </button>

        <button id="togglePremium" class="btn primary" type="button" title="Toggle premium (demo)">
          Premium: <span id="premiumState">OFF</span>
        </button>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <div class="tabs">
          <button class="tab active" data-tab="words" type="button">Words</button>
          <button class="tab" data-tab="saved" type="button">
            Saved <span id="savedCount" class="pill">0</span>
          </button>
        </div>

        <div class="searchRow">
          <input
            id="searchInput"
            class="search"
            type="text"
            placeholder="Search: 漢字 / ひらがな / meaning"
            autocomplete="off"
          />

          <select id="levelFilter" class="select" aria-label="level filter">
            <option value="ALL">All levels</option>
            <option value="N4">N4</option>
            <option value="N3">N3</option>
            <option value="N2">N2</option>
            <option value="PREMIUM">Premium only</option>
          </select>

          <select id="sortBy" class="select" aria-label="sort">
            <option value="LEVEL">Sort: Level</option>
            <option value="KANJI">Sort: Kanji</option>
          </select>
        </div>
      </section>

      <section id="list" class="grid"></section>

      <section id="savedList" class="grid hidden"></section>

      <div id="modal" class="modal hidden" data-close="1">
        <div class="modalCard" role="dialog" aria-modal="true" aria-label="Word detail">
          <button class="modalClose" data-close="1" aria-label="Close">✕</button>
          <div class="modalBody" id="modalBody"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span>Tip: Click a card for details. ★ to save.</span>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
